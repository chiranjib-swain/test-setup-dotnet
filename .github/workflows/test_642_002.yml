name: Compare setup-dotnet v3 vs v4 runtime behavior

on:
  workflow_dispatch:

jobs:
  compare:
    name: "${{ matrix.os }} | ${{ matrix.setup_version }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        setup_version: [v3, v4]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Pre-state
        shell: bash
        run: |
          dotnet --info || true
          dotnet --list-sdks || true
          dotnet --list-runtimes || true

      - name: Setup with v3
        if: matrix.setup_version == 'v3'
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.203'

      - name: Setup with v4
        if: matrix.setup_version == 'v4'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.203'

      - name: Post-state
        shell: bash
        run: |
          dotnet --info || true
          dotnet --list-sdks || true
          dotnet --list-runtimes || true
