name: Replicate Issue 387 - dotnet.exe File Lock (single step)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate-file-lock:
    runs-on: windows-latest

    steps:
      - name: Setup
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1" `
            -OutFile "C:\dotnet-install.ps1"
          New-Item -ItemType Directory -Path "C:\dotnet-test" -Force

      - name: Simulate v3 file lock bug (everything in one step)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          # ── First install: writes dotnet.exe for the first time
          Write-Host "=== First install (8.0.100) ==="
          & "C:\dotnet-install.ps1" -Version "8.0.100" -InstallDir "C:\dotnet-test" -NoPath
          $afterFirst = (Get-Item "C:\dotnet-test\dotnet.exe").LastWriteTime
          Write-Host "dotnet.exe after first install: $afterFirst"

          # ── Acquire lock IN THIS SAME PROCESS — survives until $fs.Dispose()
          $dotnetExe = "C:\dotnet-test\dotnet.exe"
          $fs = [System.IO.File]::Open(
            $dotnetExe,
            [System.IO.FileMode]::Open,
            [System.IO.FileAccess]::Read,
            [System.IO.FileShare]::Read   # allow reads, block writes
          )
          Write-Host "Lock acquired on $dotnetExe"

          # ── Second install WITHOUT -SkipNonVersionedFiles (v3 behavior)
          # ── EXPECTED: "Failed to extract package ... being used by another process"
          Write-Host ""
          Write-Host "=== Second install (9.0.100) — EXPECTED TO FAIL ==="
          & "C:\dotnet-install.ps1" -Version "9.0.100" -InstallDir "C:\dotnet-test" -NoPath

          Write-Host ""
          Write-Host "=== dotnet.exe after second install attempt ==="
          $afterSecond = (Get-Item "C:\dotnet-test\dotnet.exe").LastWriteTime
          Write-Host "Before: $afterFirst"
          Write-Host "After:  $afterSecond"
          if ($afterFirst -eq $afterSecond) {
            Write-Host "RESULT: Timestamp UNCHANGED — file was locked, overwrite blocked ✅"
          } else {
            Write-Host "RESULT: Timestamp CHANGED — file was overwritten (lock failed) ❌"
          }

          # ── Release lock
          $fs.Dispose()
          Write-Host "Lock released"
