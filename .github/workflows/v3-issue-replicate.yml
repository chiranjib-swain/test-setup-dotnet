name: Replicate Issue 387 - dotnet.exe File Lock (corrected v2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate-file-lock:
    runs-on: windows-latest

    steps:
      - name: Setup — download install script and create fresh install dir
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1" `
            -OutFile "C:\dotnet-install.ps1"

          New-Item -ItemType Directory -Path "C:\dotnet-test" -Force

      - name: First install — SDK 8.0.100 (no -SkipNonVersionedFiles = v3 behavior)
        shell: pwsh
        run: |
          & "C:\dotnet-install.ps1" `
            -Version "8.0.100" `
            -InstallDir "C:\dotnet-test" `
            -NoPath

          Write-Host "=== dotnet.exe after first install ==="
          Get-Item "C:\dotnet-test\dotnet.exe" |
            Select-Object Name, LastWriteTime, Length

      # Each step is a NEW pwsh process — runspaces die with the step.
      # Use Start-Process to launch a SEPARATE persistent process that
      # survives across step boundaries and holds the file handle.
      - name: Lock dotnet.exe via a separate persistent process
        shell: pwsh
        run: |
          $target = "C:\dotnet-test\dotnet.exe"

          # Write a small lock script to disk
          $lockScript = "C:\dotnet-test\hold-lock.ps1"

          @"
          `$fs = [System.IO.File]::Open(
              '$target',
              [System.IO.FileMode]::Open,
              [System.IO.FileAccess]::Read,
              [System.IO.FileShare]::Read   # allow reads, block ALL writes
          )
          Write-Host "LOCK HELD on $target"
          Start-Sleep -Seconds 180          # hold for 3 minutes
          `$fs.Dispose()
          Write-Host "Lock released"
          "@ | Out-File -FilePath $lockScript -Encoding UTF8

          # Start as a CHILD PROCESS — survives this step's exit
          $proc = Start-Process `
            -FilePath "pwsh" `
            -ArgumentList "-NoProfile", "-NonInteractive", "-File", $lockScript `
            -PassThru `
            -NoNewWindow

          Write-Host "Lock process started, PID=$($proc.Id)"
          Start-Sleep -Seconds 3   # wait for child process to open the file

          # Verify the lock is held (optional but useful for diagnosis)
          try {
            $test = [System.IO.File]::Open(
              $target,
              [System.IO.FileMode]::Open,
              [System.IO.FileAccess]::Write,   # try to write → should fail
              [System.IO.FileShare]::None
            )

            $test.Dispose()
            Write-Warning "Lock verification FAILED — file was writable!"
          }
          catch {
            Write-Host "Lock verification PASSED — file is write-locked: $($_.Exception.Message)"
          }

          # Persist PID for cleanup step
          "LOCK_PID=$($proc.Id)" | Out-File -Append $env:GITHUB_ENV

      # install-dotnet.ps1 WITHOUT -SkipNonVersionedFiles tries to overwrite dotnet.exe
      # → EXPECTED FAILURE: "file is being used by another process"
      - name: Second install — SDK 9.0.100 (EXPECTED TO FAIL — file lock)
        shell: pwsh
        run: |
          & "C:\dotnet-install.ps1" `
            -Version "9.0.100" `
            -InstallDir "C:\dotnet-test" `
            -NoPath
        continue-on-error: true

      - name: Show result
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== dotnet.exe after second install attempt ==="

          Get-Item "C:\dotnet-test\dotnet.exe" |
            Select-Object Name, LastWriteTime, Length

          Write-Host "=== SDKs ==="
          & "C:\dotnet-test\dotnet.exe" --list-sdks 2>&1

      - name: Kill lock process
        if: always()
        shell: pwsh
        run: |
          if ($env:LOCK_PID) {
            Stop-Process -Id $env:LOCK_PID -Force -ErrorAction SilentlyContinue
            Write-Host "Killed lock process PID=$($env:LOCK_PID)"
          }
