name: Replicate Issue 387 - dotnet.exe File Lock (corrected)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate-file-lock:
    runs-on: windows-latest

    steps:
      - name: Download install script
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1" `
            -OutFile "$env:TEMP\dotnet-install.ps1"
          # Use a fresh isolated directory — nothing preinstalled here
          New-Item -ItemType Directory -Path "C:\dotnet-test" -Force

      # ── First install into clean dir: writes dotnet.exe for the first time
      - name: First install — SDK 8.0.100 (no --skip-non-versioned-files = v3 behavior)
        shell: pwsh
        run: |
          & "$env:TEMP\dotnet-install.ps1" `
            -Version "8.0.100" `
            -InstallDir "C:\dotnet-test" `
            -NoPath
          Write-Host "dotnet.exe written:"
          Get-Item "C:\dotnet-test\dotnet.exe" | Select-Object Name, LastWriteTime, Length

      # ── Acquire write-blocking lock on that dotnet.exe
      - name: Lock dotnet.exe in background runspace
        shell: pwsh
        run: |
          $target = "C:\dotnet-test\dotnet.exe"

          $rs = [System.Management.Automation.Runspaces.RunspaceFactory]::CreateRunspace()
          $rs.Open()
          $ps = [System.Management.Automation.PowerShell]::Create()
          $ps.Runspace = $rs
          [void]$ps.AddScript({
            param([string]$path)
            # FileShare.Read = allow reads but block all writes
            $fs = [System.IO.File]::Open(
              $path,
              [System.IO.FileMode]::Open,
              [System.IO.FileAccess]::Read,
              [System.IO.FileShare]::Read
            )
            Write-Host "LOCK ACQUIRED — writes blocked on $path"
            Start-Sleep -Seconds 120
            $fs.Dispose()
          }).AddArgument($target)

          $null = $ps.BeginInvoke()
          Start-Sleep -Seconds 2
          Write-Host "Lock is active. Starting second install..."

      # ── Second install: tries to overwrite dotnet.exe → SHOULD FAIL
      #    This is exactly what v3 did (no --skip-non-versioned-files)
      - name: Second install — SDK 9.0.100 (EXPECTED: file lock error)
        shell: pwsh
        run: |
          & "$env:TEMP\dotnet-install.ps1" `
            -Version "9.0.100" `
            -InstallDir "C:\dotnet-test" `
            -NoPath
        continue-on-error: true

      - name: Show result
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== SDKs in test dir ==="
          & "C:\dotnet-test\dotnet.exe" --list-sdks 2>&1 || true
          Write-Host "=== dotnet.exe last write ==="
          Get-Item "C:\dotnet-test\dotnet.exe" | Select-Object Name, LastWriteTime
