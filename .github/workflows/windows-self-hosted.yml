name: Windows Self-Hosted Clean-Slate Test (x64)

on:
  workflow_dispatch:
    inputs:
      clean_slate:
        description: 'Remove preinstalled .NET before each job (simulate clean slate)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:

  # ── Job 1: v4 (Pass 1 + Pass 2) ────────────────────────────────────────────
  v4-self-hosted-x64:
    name: "v4 | self-hosted Windows x64 | 6.0+7.0+8.0+9.0"
    runs-on: [self-hosted, windows, x64]
    steps:

      - name: "Clean slate — remove any preinstalled or leftover .NET"
        if: ${{ inputs.clean_slate }}
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:USERPROFILE\.dotnet"   -ErrorAction SilentlyContinue
          [System.Environment]::SetEnvironmentVariable("DOTNET_ROOT", $null, "Process")
          [System.Environment]::SetEnvironmentVariable("DOTNET_ROOT", $null, "User")
          Write-Host "Clean slate confirmed — .NET directories removed"

      - name: "BEFORE — verify machine state"
        shell: powershell
        run: |
          dotnet --version 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "(no dotnet — clean slate confirmed)" }
          Write-Host "C:\Program Files\dotnet exists: $(Test-Path 'C:\Program Files\dotnet')"
          Write-Host ".dotnet exists: $(Test-Path "$env:USERPROFILE\.dotnet")"

      - uses: actions/checkout@v4

      - name: "setup-dotnet v4 — EOL 6.0+7.0 + current 8.0+9.0"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x

      - name: "AFTER — v4 result (Pass 1 + Pass 2)"
        shell: powershell
        run: |
          Write-Host "=== DOTNET_ROOT ==="
          Write-Host $env:DOTNET_ROOT
          Write-Host "=== dotnet --version ==="
          dotnet --version
          Write-Host "=== SDKs ==="
          dotnet --list-sdks
          Write-Host "=== Runtimes ==="
          dotnet --list-runtimes
          Write-Host "=== host\fxr entries ==="
          Get-ChildItem "$env:DOTNET_ROOT\host\fxr" | Select-Object Name
          Write-Host "=== dotnet --info (Host + Architecture) ==="
          dotnet --info | Select-String "Version|Architecture|Commit" | Select-Object -First 6

      - name: "Build test project"
        shell: powershell
        run: dotnet build __tests__/e2e-test-csproj/test.csproj


  # ── Job 2: issue_642 (Pass 2 only) ─────────────────────────────────────────
  issue642-self-hosted-x64:
    name: "issue_642 | self-hosted Windows x64 | 6.0+7.0+8.0+9.0"
    runs-on: [self-hosted, windows, x64]
    steps:

      - name: "Clean slate — remove .NET left from previous job"
        if: ${{ inputs.clean_slate }}
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:USERPROFILE\.dotnet"   -ErrorAction SilentlyContinue
          [System.Environment]::SetEnvironmentVariable("DOTNET_ROOT", $null, "Process")
          [System.Environment]::SetEnvironmentVariable("DOTNET_ROOT", $null, "User")
          Write-Host "Clean slate confirmed"

      - name: "BEFORE — verify machine state"
        shell: powershell
        run: |
          dotnet --version 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "(no dotnet — clean slate confirmed)" }
          Write-Host "C:\Program Files\dotnet exists: $(Test-Path 'C:\Program Files\dotnet')"

      - uses: actions/checkout@v4

      - name: "setup-dotnet issue_642 — EOL 6.0+7.0 + current 8.0+9.0 (Pass 2 only)"
        uses: chiranjib-swain/setup-dotnet@issue_642
        with:
          dotnet-version: |
            6.0.x
            7.0.x
            8.0.x
            9.0.x

      - name: "AFTER — issue_642 result (no LTS pre-pass)"
        shell: powershell
        run: |
          Write-Host "=== DOTNET_ROOT ==="
          Write-Host $env:DOTNET_ROOT
          Write-Host "=== dotnet --version ==="
          dotnet --version
          Write-Host "=== SDKs ==="
          dotnet --list-sdks
          Write-Host "=== Runtimes ==="
          dotnet --list-runtimes
          Write-Host "=== host\fxr entries ==="
          Get-ChildItem "$env:DOTNET_ROOT\host\fxr" | Select-Object Name
          Write-Host "=== dotnet --info (Host + Architecture) ==="
          dotnet --info | Select-String "Version|Architecture|Commit" | Select-Object -First 6

      - name: "Build test project"
        shell: powershell
        run: dotnet build __tests__/e2e-test-csproj/test.csproj
