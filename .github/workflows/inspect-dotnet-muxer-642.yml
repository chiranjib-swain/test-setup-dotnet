name: Inspect .NET Host and Muxer

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Before setup-dotnet
        shell: pwsh
        run: |
          Write-Host "=== dotnet location ==="
          Get-Command dotnet | Format-List *

          Write-Host ""
          Write-Host "=== DOTNET_ROOT ==="
          Write-Host $env:DOTNET_ROOT

          Write-Host ""
          Write-Host "=== dotnet.exe ==="
          Get-Item "$env:DOTNET_ROOT\dotnet.exe" | Format-List *

          Write-Host ""
          Write-Host "=== host/fxr ==="
          Get-ChildItem "$env:DOTNET_ROOT\host\fxr"

          Write-Host ""
          Write-Host "=== SDKs ==="
          dotnet --list-sdks

          Write-Host ""
          Write-Host "=== Runtimes ==="
          dotnet --list-runtimes

          Write-Host ""
          Write-Host "=== dotnet --info ==="
          dotnet --info

      - name: Install latest LTS runtime
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: After setup-dotnet
        shell: pwsh
        run: |
          Write-Host "=== dotnet.exe ==="
          Get-Item "$env:DOTNET_ROOT\dotnet.exe" | Format-List *

          Write-Host ""
          Write-Host "=== host/fxr ==="
          Get-ChildItem "$env:DOTNET_ROOT\host\fxr"

          Write-Host ""
          Write-Host "=== SDKs ==="
          dotnet --list-sdks

          Write-Host ""
          Write-Host "=== Runtimes ==="
          dotnet --list-runtimes

          Write-Host ""
          Write-Host "=== dotnet --info ==="
          dotnet --info
