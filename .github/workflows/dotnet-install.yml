name: Dotnet Install Test

on:
  workflow_dispatch:

jobs:
  detect-and-use:
    runs-on: ubuntu-latest

    steps:
      - name: Show preinstalled versions
        shell: bash
        run: |
          echo "=== SDKs ==="
          dotnet --list-sdks || true

          echo
          echo "=== Runtimes ==="
          dotnet --list-runtimes || true

      - name: Detect latest SDK and latest Microsoft.NETCore.App runtime
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # Latest SDK from image
          LATEST_SDK="$(dotnet --list-sdks | awk '{print $1}' | sort -V | tail -1)"

          # Latest Microsoft.NETCore.App runtime from image
          LATEST_RT="$(dotnet --list-runtimes \
            | awk '$1=="Microsoft.NETCore.App"{print $2}' \
            | sort -V | tail -1)"

          echo "latest_sdk=$LATEST_SDK" >> "$GITHUB_OUTPUT"
          echo "latest_runtime=$LATEST_RT" >> "$GITHUB_OUTPUT"

          echo "Detected SDK: $LATEST_SDK"
          echo "Detected Runtime: $LATEST_RT"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.203'

      - name: Show versions after setup-dotnet
        shell: bash
        run: |
          echo "=== dotnet --info ==="
          dotnet --info

          echo
          echo "=== dotnet executable ==="
          which dotnet
          readlink -f "$(which dotnet)" || true

          echo
          echo "=== SDKs ==="
          dotnet --list-sdks

          echo
          echo "=== Runtimes ==="
          dotnet --list-runtimes

          echo
          echo "=== Environment ==="
          echo "DOTNET_ROOT=$DOTNET_ROOT"
          echo "PATH=$PATH"

          echo
          echo "=== SDK directory ==="
          ls -la "$DOTNET_ROOT/sdk" || true

          echo
          echo "=== Shared runtimes ==="
          ls -la "$DOTNET_ROOT/shared/Microsoft.NETCore.App" || true
          ls -la "$DOTNET_ROOT/shared/Microsoft.AspNetCore.App" || true
