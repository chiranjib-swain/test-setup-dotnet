name: Inspect .NET Muxer Across Multiple Installs (macOS)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: self-hosted

    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Initial Machine State
        shell: bash
        run: |
          set -euo pipefail

          inspect_dotnet() {
            local TITLE="$1"

            echo
            echo "=================================================="
            echo "$TITLE"
            echo "=================================================="

            cd "$(mktemp -d)"

            DOTNET_EXE=$(command -v dotnet || true)

            if [ -z "$DOTNET_EXE" ]; then
              echo "dotnet not found on PATH"
              return
            fi

            DOTNET_EXE_REAL=$(realpath "$DOTNET_EXE" 2>/dev/null || echo "$DOTNET_EXE")
            DOTNET_ROOT_ACTUAL=$(dirname "$DOTNET_EXE_REAL")

            echo
            echo "DOTNET_EXE=$DOTNET_EXE"
            echo "DOTNET_EXE_REAL=$DOTNET_EXE_REAL"
            echo "DOTNET_ROOT_ACTUAL=$DOTNET_ROOT_ACTUAL"
            echo "DOTNET_ROOT(env)=${DOTNET_ROOT:-<unset>}"

            echo
            echo "=== dotnet executable ==="
            ls -lh "$DOTNET_EXE_REAL"

            echo
            echo "=== SHA256 ==="
            shasum -a 256 "$DOTNET_EXE_REAL"

            echo
            echo "=== host/fxr ==="
            ls -la "$DOTNET_ROOT_ACTUAL/host/fxr" || true

            echo
            echo "=== SDKs ==="
            dotnet --list-sdks || true

            echo
            echo "=== Runtimes ==="
            dotnet --list-runtimes || true

            echo
            echo "=== dotnet --info ==="
            dotnet --info || true
          }

          inspect_dotnet "Initial Machine State"

      # ── Install 1: specific older SDK ────────────────────────────────────
      - name: Install SDK 8.0.423
        uses: chiranjib-swain/setup-dotnet@issue_642
        with:
          dotnet-version: 8.0.423

      - name: Inspect after SDK 8.0.423
        shell: bash
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"

          echo "DOTNET_ROOT=$DOTNET_ROOT"
          DOTNET_EXE="$DOTNET_ROOT/dotnet"

          echo
          echo "=== dotnet executable ==="
          ls -lh "$DOTNET_EXE"

          echo
          echo "=== SHA256 ==="
          shasum -a 256 "$DOTNET_EXE"

          echo
          echo "=== host/fxr ==="
          ls -la "$DOTNET_ROOT/host/fxr"

          echo
          echo "=== SDKs ==="
          dotnet --list-sdks

          echo
          echo "=== Runtimes ==="
          dotnet --list-runtimes

          echo
          echo "=== dotnet --info ==="
          dotnet --info

      # ── Install 2: latest 9.0.x patch ────────────────────────────────────
      - name: Install SDK 9.0.x
        uses: chiranjib-swain/setup-dotnet@issue_642
        with:
          dotnet-version: 9.0.x

      - name: Inspect after SDK 9.0.x
        shell: bash
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"

          echo "DOTNET_ROOT=$DOTNET_ROOT"
          DOTNET_EXE="$DOTNET_ROOT/dotnet"

          echo
          echo "=== dotnet executable ==="
          ls -lh "$DOTNET_EXE"

          echo
          echo "=== SHA256 ==="
          shasum -a 256 "$DOTNET_EXE"

          echo
          echo "=== host/fxr ==="
          ls -la "$DOTNET_ROOT/host/fxr"

          echo
          echo "=== SDKs ==="
          dotnet --list-sdks

          echo
          echo "=== Runtimes ==="
          dotnet --list-runtimes

          echo
          echo "=== dotnet --info ==="
          dotnet --info



          echo
          echo "=== dotnet --info ==="
          dotnet --info
