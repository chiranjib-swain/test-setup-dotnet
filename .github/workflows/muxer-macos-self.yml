name: Inspect .NET Muxer Across Multiple Installs (Windows)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: windows-latest

    env:
      DOTNET_MULTILEVEL_LOOKUP: 0
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1

    steps:
      - name: Define inspection function
        shell: pwsh
        run: |
          @'
          function Inspect-Dotnet {
              param([string]$Title)

              Write-Host ""
              Write-Host "=================================================="
              Write-Host $Title
              Write-Host "=================================================="

              Set-Location $env:RUNNER_TEMP

              $dotnet = Get-Command dotnet -ErrorAction SilentlyContinue

              if (-not $dotnet) {
                  Write-Host "dotnet not found on PATH"
                  return
              }

              $dotnetExe = $dotnet.Source
              $dotnetRoot = Split-Path $dotnetExe

              Write-Host ""
              Write-Host "DOTNET_EXE=$dotnetExe"
              Write-Host "DOTNET_ROOT_ACTUAL=$dotnetRoot"
              Write-Host "DOTNET_ROOT(env)=$env:DOTNET_ROOT"

              Write-Host ""
              Write-Host "=== dotnet executable ==="
              Get-Item $dotnetExe | Format-List *

              Write-Host ""
              Write-Host "=== FileVersionInfo ==="
              (Get-Item $dotnetExe).VersionInfo | Format-List *

              Write-Host ""
              Write-Host "=== SHA256 ==="
              Get-FileHash $dotnetExe -Algorithm SHA256

              Write-Host ""
              Write-Host "=== host/fxr ==="
              Get-ChildItem "$dotnetRoot\host\fxr" -Force -ErrorAction SilentlyContinue

              Write-Host ""
              Write-Host "=== SDKs ==="
              dotnet --list-sdks

              Write-Host ""
              Write-Host "=== Runtimes ==="
              dotnet --list-runtimes

              Write-Host ""
              Write-Host "=== dotnet --info ==="
              dotnet --info
          }
          '@ | Set-Content inspect.ps1

      - name: Initial Machine State
        shell: pwsh
        run: |
          . .\inspect.ps1
          Inspect-Dotnet "Initial Machine State"

      - name: Install SDK 8.0.423
        uses: chiranjib-swain/setup-dotnet@issue_642
        with:
          dotnet-version: 8.0.423

      - name: Inspect after SDK 8.0.423
        shell: pwsh
        run: |
          . .\inspect.ps1
          Inspect-Dotnet "After SDK 8.0.423"

      - name: Install SDK 9.0.x
        uses: chiranjib-swain/setup-dotnet@issue_642
        with:
          dotnet-version: 9.0.x

      - name: Inspect after SDK 9.0.x
        shell: pwsh
        run: |
          . .\inspect.ps1
          Inspect-Dotnet "After SDK 9.0.x"
