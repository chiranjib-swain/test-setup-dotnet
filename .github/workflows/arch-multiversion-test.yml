name: Multi-Version + Architecture Install Test

on:
  workflow_dispatch:

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Architecture is determined by the runner itself — no 'architecture' input
# (that input is not present in the published actions/setup-dotnet@v4).
#
# Runner            | OS      | Arch   | Default install dir
# ──────────────────┼─────────┼────────┼────────────────────────────────────
# ubuntu-latest     | Linux   | x64    | /usr/share/dotnet/
# ubuntu-24.04-arm  | Linux   | arm64  | /usr/share/dotnet/
# windows-latest    | Windows | x64    | C:\Program Files\dotnet\
# windows-11-arm    | Windows | arm64  | C:\Program Files\dotnet\
# macos-15-intel    | macOS   | x64    | ~/.dotnet/
# macos-latest      | macOS   | arm64  | ~/.dotnet/
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  install-multiversion:
    name: "${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest       # x64  Linux
          - ubuntu-24.04-arm    # arm64 Linux
          - windows-latest      # x64  Windows
          - windows-11-arm      # arm64 Windows
          - macos-15-intel      # x64  macOS (Intel)
          - macos-latest        # arm64 macOS (Apple Silicon)

    steps:
      # ── BEFORE ────────────────────────────────────────────────────────────
      - name: "BEFORE — runner arch, preinstalled muxer and host/fxr"
        shell: bash
        run: |
          echo "============================================================"
          echo " Runner OS  : $RUNNER_OS"
          echo " Runner arch: $(uname -m)"
          echo "============================================================"
          echo ""
          echo "--- muxer version (preinstalled) ---"
          dotnet --version 2>/dev/null || echo "(none)"
          echo ""
          echo "--- installed SDKs ---"
          dotnet --list-sdks 2>/dev/null || echo "(none)"
          echo ""
          echo "--- installed runtimes ---"
          dotnet --list-runtimes 2>/dev/null || echo "(none)"
          echo ""
          echo "--- host/fxr directories ---"
          for p in \
            "$HOME/.dotnet/host/fxr" \
            "/usr/share/dotnet/host/fxr" \
            "${PROGRAMFILES}/dotnet/host/fxr"
          do
            [ -d "$p" ] && echo "  $p:" && ls "$p" || true
          done

      # ── SETUP-DOTNET ──────────────────────────────────────────────────────
      - name: "setup-dotnet — 8.0.x + 9.0.x"
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # ── AFTER ─────────────────────────────────────────────────────────────
      - name: "AFTER — DOTNET_ROOT, muxer, SDKs, runtimes, host/fxr"
        shell: bash
        run: |
          echo "============================================================"
          echo " DOTNET_ROOT = $DOTNET_ROOT"
          echo "============================================================"
          echo ""
          echo "--- muxer version (should be latest LTS from Pass 1) ---"
          dotnet --version
          echo ""
          echo "--- installed SDKs ---"
          dotnet --list-sdks
          echo ""
          echo "--- installed runtimes ---"
          dotnet --list-runtimes
          echo ""
          echo "--- host/fxr directories (LTS + 8.0.x + 9.0.x entries) ---"
          for p in \
            "$HOME/.dotnet/host/fxr" \
            "/usr/share/dotnet/host/fxr" \
            "${PROGRAMFILES}/dotnet/host/fxr"
          do
            [ -d "$p" ] && echo "  $p:" && ls "$p" || true
          done
          echo ""
          echo "--- muxer binary location ---"
          command -v dotnet && ls -la "$(command -v dotnet)" || true
