name: "test-issue-642 — skip LTS pre-pass on Windows"

on:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Single install — one dotnet-version on windows-latest
  # Goal : verify the SDK installs and `dotnet --version` resolves
  #        correctly without the LTS runtime pre-pass on Windows.
  # ─────────────────────────────────────────────────────────────────
  single-install-windows:
    name: "Windows — single install (9.0.x)"
    runs-on: windows-latest
    steps:
      - name: Checkout test repo
        uses: actions/checkout@v4

      - name: Setup .NET (patched — issue_642 branch)
        uses: chiranjib-swain/setup-dotnet@issue_642
        with:
          dotnet-version: "9.0.x"

      - name: Report dotnet versions (single-install-windows)
        shell: pwsh
        run: |
          Write-Host "=== dotnet --version ==="
          dotnet --version
          Write-Host "=== dotnet --list-sdks ==="
          dotnet --list-sdks
          Write-Host "=== dotnet --list-runtimes ==="
          dotnet --list-runtimes

      - name: Verify installed version
        shell: pwsh
        run: |
          $sdks = dotnet --list-sdks
          Write-Host "Installed SDKs:"
          $sdks | ForEach-Object { Write-Host "  $_" }
          if (-not ($sdks | Where-Object { $_ -match '^9\.' })) {
            Write-Error "9.0.x SDK not found in --list-sdks"
            exit 1
          }
          Write-Host "9.0.x SDK present."

      - name: Smoke-test dotnet info
        shell: pwsh
        run: dotnet --info

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Multiple installs in a single step — matrix of versions
  #        on windows-latest.
  # Goal : confirm the muxer installed by SDK A does not break SDK B
  #        when both are installed sequentially in the same job.
  # ─────────────────────────────────────────────────────────────────
  multi-install-windows:
    name: "Windows — multi-install (8.0.x + 9.0.x)"
    runs-on: windows-latest
    steps:
      - name: Checkout test repo
        uses: actions/checkout@v4

      # Install first SDK
      - name: Setup .NET 8.0.x (patched)
        uses: chiranjib-swain/setup-dotnet@issue_642
        with:
          dotnet-version: "8.0.x"

      # Install second SDK in the same job — the muxer must survive
      - name: Setup .NET 9.0.x (patched)
        uses: chiranjib-swain/setup-dotnet@issue_642
        with:
          dotnet-version: "9.0.x"

      - name: Report dotnet versions (multi-install-windows)
        shell: pwsh
        run: |
          Write-Host "=== dotnet --version ==="
          dotnet --version
          Write-Host "=== dotnet --list-sdks ==="
          dotnet --list-sdks
          Write-Host "=== dotnet --list-runtimes ==="
          dotnet --list-runtimes

      - name: Verify both SDKs are listed
        shell: pwsh
        run: |
          $sdks = dotnet --list-sdks
          Write-Host "Installed SDKs:"
          $sdks | ForEach-Object { Write-Host "  $_" }
          $has8 = $sdks | Where-Object { $_ -match '^8\.' }
          $has9 = $sdks | Where-Object { $_ -match '^9\.' }
          if (-not $has8) { Write-Error "8.0.x SDK not found!"; exit 1 }
          if (-not $has9) { Write-Error "9.0.x SDK not found!"; exit 1 }
          Write-Host "Both SDKs present."

      - name: Verify muxer version resolves to latest installed
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Active muxer version → $v"
          dotnet --info

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Baseline — same tests on ubuntu-latest so we can compare
  #        output between the patched (Linux keeps the pre-pass) and
  #        Windows (pre-pass skipped) behaviour.
  # ─────────────────────────────────────────────────────────────────
  multi-install-ubuntu:
    name: "Ubuntu — multi-install baseline (8.0.x + 9.0.x)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test repo
        uses: actions/checkout@v4

      - name: Setup .NET 8.0.x (patched)
        uses: chiranjib-swain/setup-dotnet@issue_642
        with:
          dotnet-version: "8.0.x"

      - name: Setup .NET 9.0.x (patched)
        uses: chiranjib-swain/setup-dotnet@issue_642
        with:
          dotnet-version: "9.0.x"

      - name: Report dotnet versions (multi-install-ubuntu)
        run: |
          echo "=== dotnet --version ==="
          dotnet --version
          echo "=== dotnet --list-sdks ==="
          dotnet --list-sdks
          echo "=== dotnet --list-runtimes ==="
          dotnet --list-runtimes

      - name: Verify both SDKs are listed
        run: |
          echo "Installed SDKs:"
          dotnet --list-sdks
          dotnet --list-sdks | grep -q "^8\." || (echo "ERROR: 8.0.x not found" && exit 1)
          dotnet --list-sdks | grep -q "^9\." || (echo "ERROR: 9.0.x not found" && exit 1)
          echo "Both SDKs present."

      - name: Verify muxer
        run: |
          echo "Active version: $(dotnet --version)"
          dotnet --info

  # ─────────────────────────────────────────────────────────────────
  # Job 4: hostfxr lifecycle trace — Windows only
  # Goal : snapshot host\fxr\ BEFORE any install, AFTER Pass 1
  #        (LTS runtime, same as v4 does), and AFTER Pass 2 (SDK).
  #        Proves whether Pass 1 adds a new hostfxr.dll version and
  #        whether dotnet.exe then picks the higher one.
  # ─────────────────────────────────────────────────────────────────
  hostfxr-lifecycle-windows:
    name: "Windows — hostfxr lifecycle trace"
    runs-on: windows-latest
    env:
      DOTNET_ROOT: "C:\\Program Files\\dotnet"
    steps:
      - name: "[BEFORE] snapshot host\\fxr\\ from runner image"
        shell: pwsh
        run: |
          $fxrRoot = "C:\Program Files\dotnet\host\fxr"
          Write-Host "=== host\fxr versions present BEFORE any install ==="
          if (Test-Path $fxrRoot) {
            Get-ChildItem $fxrRoot -Directory | ForEach-Object {
              $dll = Join-Path $_.FullName "hostfxr.dll"
              $ver = if (Test-Path $dll) { (Get-Item $dll).VersionInfo.FileVersion } else { "dll missing" }
              Write-Host "  $($_.Name)  →  hostfxr.dll file-version: $ver"
            }
          } else {
            Write-Host "  (host\fxr directory does not exist yet)"
          }
          Write-Host ""
          Write-Host "=== dotnet.exe host binary before any install ==="
          $muxer = "C:\Program Files\dotnet\dotnet.exe"
          if (Test-Path $muxer) {
            $info = Get-Item $muxer
            Write-Host "  dotnet.exe file-version : $($info.VersionInfo.FileVersion)"
            Write-Host "  dotnet.exe product-version: $($info.VersionInfo.ProductVersion)"
            Write-Host "  dotnet.exe last-write    : $($info.LastWriteTimeUtc) UTC"
          } else {
            Write-Host "  dotnet.exe does not exist yet"
          }

      # ── Simulate Pass 1 exactly as actions/setup-dotnet@v4 does it ──
      - name: "[PASS 1] Install LTS runtime only (mirrors v4 behaviour)"
        shell: pwsh
        run: |
          $script = "$env:GITHUB_ACTION_PATH\..\..\..\chiranjib-swain\setup-dotnet\issue_642\externals\install-dotnet.ps1"
          # Fall back to downloading if not cached yet
          if (-not (Test-Path $script)) {
            $script = Join-Path $env:RUNNER_TEMP "install-dotnet.ps1"
            Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile $script
          }
          Write-Host "Running: $script -SkipNonVersionedFiles -Runtime dotnet -Channel LTS"
          & "C:\Program Files\PowerShell\7\pwsh.exe" -NoLogo -Sta -NoProfile -NonInteractive `
            -ExecutionPolicy Unrestricted -Command "& '$script' -SkipNonVersionedFiles -Runtime dotnet -Channel LTS"

      - name: "[AFTER PASS 1] snapshot host\\fxr\\ after LTS runtime install"
        shell: pwsh
        run: |
          $fxrRoot = "C:\Program Files\dotnet\host\fxr"
          Write-Host "=== host\fxr versions present AFTER Pass 1 (LTS runtime) ==="
          Get-ChildItem $fxrRoot -Directory | ForEach-Object {
            $dll = Join-Path $_.FullName "hostfxr.dll"
            $ver = if (Test-Path $dll) { (Get-Item $dll).VersionInfo.FileVersion } else { "dll missing" }
            Write-Host "  $($_.Name)  →  hostfxr.dll file-version: $ver"
          }
          Write-Host ""
          Write-Host "=== dotnet.exe after Pass 1 ==="
          $info = Get-Item "C:\Program Files\dotnet\dotnet.exe"
          Write-Host "  dotnet.exe file-version : $($info.VersionInfo.FileVersion)"
          Write-Host "  dotnet.exe last-write   : $($info.LastWriteTimeUtc) UTC"
          Write-Host ""
          Write-Host "=== dotnet --info Host section after Pass 1 ==="
          dotnet --info | Select-String -Pattern "Host:|Version:|Architecture:|Commit:" | Select-Object -First 4

      # ── Pass 2: install user SDK (same as both v4 and our fix) ──
      - name: "[PASS 2] Install SDK 9.0.x"
        uses: chiranjib-swain/setup-dotnet@issue_642
        with:
          dotnet-version: "9.0.x"

      - name: "[AFTER PASS 2] snapshot host\\fxr\\ after SDK install"
        shell: pwsh
        run: |
          $fxrRoot = "C:\Program Files\dotnet\host\fxr"
          Write-Host "=== host\fxr versions present AFTER Pass 2 (SDK 9.0.x) ==="
          Get-ChildItem $fxrRoot -Directory | ForEach-Object {
            $dll = Join-Path $_.FullName "hostfxr.dll"
            $ver = if (Test-Path $dll) { (Get-Item $dll).VersionInfo.FileVersion } else { "dll missing" }
            $writeTime = if (Test-Path $dll) { (Get-Item $dll).LastWriteTimeUtc.ToString("yyyy-MM-dd HH:mm:ss") } else { "" }
            Write-Host "  $($_.Name)  →  hostfxr.dll file-version: $ver  (written: $writeTime UTC)"
          }
          Write-Host ""
          Write-Host "=== dotnet.exe after Pass 2 ==="
          $info = Get-Item "C:\Program Files\dotnet\dotnet.exe"
          Write-Host "  dotnet.exe file-version : $($info.VersionInfo.FileVersion)"
          Write-Host "  dotnet.exe last-write   : $($info.LastWriteTimeUtc) UTC"
          Write-Host ""
          Write-Host "=== dotnet --info Host section after Pass 2 ==="
          dotnet --info | Select-String -Pattern "Host:|Version:|Architecture:|Commit:" | Select-Object -First 4
          Write-Host ""
          Write-Host "=== CONCLUSION: which hostfxr.dll does the muxer load? ==="
          $versions = Get-ChildItem $fxrRoot -Directory | Sort-Object {
            [version]($_.Name -replace '[^0-9.]','')
          } -Descending
          Write-Host "  Highest hostfxr.dll version in host\fxr\: $($versions[0].Name)"
          Write-Host "  dotnet --version (SDK resolved): $(dotnet --version)"
